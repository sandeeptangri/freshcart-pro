<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart Pro - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; color: #1a1a1a; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF6B35 100%); padding: 12px 0; }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { text-decoration: none; }
        .logo-text { font-size: 32px; font-weight: 800; color: #1a1a1a; letter-spacing: -1px; }
        .logo-tagline { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.6); text-transform: uppercase; letter-spacing: 2px; }
        
        /* Main Content */
        .main { max-width: 420px; margin: 0 auto; padding: 40px 20px; }
        
        /* Auth Header */
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-icon { display: inline-block; background: linear-gradient(135deg, #FFD700 0%, #FF6B35 100%); border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        .auth-icon span { font-size: 70px; }
        .auth-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { color: #666; font-size: 15px; }
        
        /* Auth Card */
        .auth-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px; }
        .phone-input { position: relative; }
        .phone-input .prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-weight: 600; color: #666; }
        .phone-input input { width: 100%; padding: 14px 16px 14px 56px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.2s; }
        .phone-input input:focus { outline: none; border-color: #FFA500; }
        
        .submit-btn { width: 100%; background: linear-gradient(135deg, #FFD700 0%, #FF6B35 100%); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        /* Divider */
        .divider { position: relative; text-align: center; margin: 25px 0; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e5e7eb; }
        .divider span { position: relative; background: white; padding: 0 16px; font-size: 14px; color: #666; }
        
        /* Google Button */
        .google-btn { width: 100%; background: white; border: 2px solid #e5e7eb; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; color: #374151; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
        .google-btn:hover { background: #f9fafb; }
        .google-btn svg { width: 20px; height: 20px; }
        
        /* Signup Link */
        .signup-link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .signup-link a { color: #FF6B35; font-weight: 600; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
        
        /* Trust Badges */
        .trust-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; text-align: center; }
        .trust-badge-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 22px; }
        .trust-badge-text { font-size: 13px; color: #666; }
        .bg-green { background: #e8f5e9; }
        .bg-blue { background: #e3f2fd; }
        .bg-purple { background: #f3e5f5; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="demo.html" class="logo">
                <div class="logo-text">freshcart</div>
                <div class="logo-tagline">instant delivery</div>
            </a>
            <div></div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <div class="auth-header">
            <div class="auth-icon">
                <span>🥬</span>
            </div>
            <h1 class="auth-title">Welcome to FreshCart</h1>
            <p class="auth-subtitle">Sign in to continue shopping</p>
        </div>
        
        <div class="auth-card">
            <form onsubmit="return false;">
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="phone-input">
                        <span class="prefix">+91</span>
                        <input type="tel" placeholder="99999 99999" maxlength="10">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Continue</button>
            </form>
            
            <div class="divider">
                <span>Or continue with</span>
            </div>
            
            <button class="google-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
            </button>
            
            <div class="signup-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
        
        <!-- Trust Badges -->
        <div class="trust-badges">
            <div>
                <div class="trust-badge-icon bg-green">✅</div>
                <div class="trust-badge-text">Fast Delivery</div>
            </div>
            <div>
                <div class="trust-badge-icon bg-blue">🔐</div>
                <div class="trust-badge-text">Secure Login</div>
            </div>
            <div>
                <div class="trust-badge-icon bg-purple">⏰</div>
                <div class="trust-badge-text">24/7 Support</div>
            </div>
        </div>
    </main>
</body>
</html>
